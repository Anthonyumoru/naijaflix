<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="monetag" content="6683eb2c8c54e6fcbdf286acfce8cec8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e50914" />
    <link rel="icon" type="image/png" href="/icon-192.png" />

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9990443784312840"
     crossorigin="anonymous"></script>

    <!-- SEO -->
    <title>NaijaFlix — Watch Nollywood Movies, Comedy, Church Programs & Music Videos</title>
    <meta name="description" content="Stream and download Nollywood movies, comedy, church programs, drama, action films, and music videos on NaijaFlix. Fast, free, and built for Nigeria." />
    <meta name="keywords" content="Nollywood, NaijaFlix, Nigerian movies, Nollywood movies, comedy, church program, music video, drama, action, Snapchat, watch movies online, Nigeria streaming" />
    <meta name="author" content="NaijaFlix" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://naijaflix.site/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NaijaFlix" />
    <meta property="og:title" content="NaijaFlix — Watch Nollywood Movies, Comedy, Church Programs & Music Videos" />
    <meta property="og:description" content="Stream and download Nollywood movies, comedy, church programs, drama, action films, and music videos on NaijaFlix." />
    <meta property="og:url" content="https://naijaflix.site/" />
    <meta property="og:image" content="https://naijaflix.site/og-image.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NaijaFlix — Watch Nollywood Movies & More" />
    <meta name="twitter:description" content="Stream and download Nollywood movies, comedy, church programs, and music videos on NaijaFlix." />
    <meta name="twitter:image" content="https://naijaflix.site/og-image.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "NaijaFlix",
      "url": "https://naijaflix.site/",
      "description": "Stream and download Nollywood movies, comedy, church programs, drama, action films, and music videos.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://naijaflix.site/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Cast sender — deferred so it does NOT block rendering -->
    <script defer src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

    <!-- Instant loading skeleton so users see something immediately -->
    <style>
      #boot-splash {
        position: fixed; inset: 0; background: #0a0a0a;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 16px; z-index: 9999;
      }
      #boot-splash .logo { font-size: 56px; }
      #boot-splash .name { color: #e50914; font-size: 28px; font-weight: 800; font-family: -apple-system, sans-serif; }
      #boot-splash .spinner {
        width: 32px; height: 32px; border: 3px solid #222;
        border-top-color: #e50914; border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash">
      <div class="logo">🎬</div>
      <div class="name">NaijaFlix</div>
      <div class="spinner"></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
